<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Part-4-Homework-1</title>

<body style="position: relative; min-height: 100vh; margin:0; background-color:#f0f0f0">
    <!-- Applay Class/es In CSS -->
    <div class="center-flex" style="height: 50vh; background-color: #ddd;">
        <div class="circle-200"
            style="background-color: red; color: white; display: flex; justify-content: center; align-items: center;">
            Flex + Circle 200
        </div>
    </div>

    <div style="position: relative; height: 50vh; background-color: #eee;">
        <div class="center-position circle-100"
            style="background-color: blue; color: white; display: flex; justify-content: center; align-items: center; text-align: center; font-size: 12px;">
            Position + Circle 100
        </div>
    </div>
</body>
